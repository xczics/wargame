# A version tag (vA.B.C, AGENTS.md "版本号与发布") makes a release: checks pass, the Docker image is built for
# amd64 and arm64 and pushed to GHCR (ghcr.io/<owner>/wargame:A.B.C and :latest), then the GitHub Release
# is created with the self-hosting instructions and docker-compose.yml attached.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          {
            echo "## Docker 部署"
            echo
            echo '```sh'
            echo "docker run -d --name wargame -p 4173:4173 -v wargame:/data ${IMAGE}:${VERSION#v}"
            echo '```'
            echo
            echo "或者下载附件 \`docker-compose.yml\` 后 \`docker compose up -d\`。打开 http://localhost:4173 ，用 GM 账号 \`gm\` / \`wargame-gm\` 登录：这只是初始密码，登录后会要求立即改成你自己的。"
            echo "首次启动会自动建库、生成地图并放好 NPC 城池（约几分钟）；数据都在卷 \`/data\` 里。升级：拉新镜像后重建容器，数据保留。"
            echo
            echo "部署到 Cloudflare 见 [docs/deployment.md](https://github.com/${{ github.repository }}/blob/${VERSION}/docs/deployment.md)。"
            echo
            echo "## 改动"
            echo
            echo "见 [docs/changelogs/](https://github.com/${{ github.repository }}/tree/${VERSION}/docs/changelogs)。"
          } > notes.md
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md docker-compose.yml
