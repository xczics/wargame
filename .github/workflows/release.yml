# A version tag (vA.B.C, AGENTS.md "版本号与发布") makes a release: checks pass, the Docker image is built for
# amd64 and arm64 and pushed to GHCR (ghcr.io/<owner>/wargame:A.B.C and :latest), then the GitHub Release
# is created with what changed since the last release (docs/releases/A.B.C.md, required: the release stops
# before anything is built without it), the self-hosting instructions and docker-compose.yml attached.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: What changed (docs/releases/A.B.C.md)
        env:
          VERSION: ${{ github.ref_name }}
        run: test -s "docs/releases/${VERSION#v}.md" || { echo "::error::docs/releases/${VERSION#v}.md is missing: list what changed since the last release"; exit 1; }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        # What changed (docs/releases/A.B.C.md), then .github/release-notes.md with the image, version and repository filled in.
        run: |
          { cat "docs/releases/${VERSION#v}.md"; echo; } > notes.md
          sed -e "s#__IMAGE__#${IMAGE}#g" -e "s#__VERSION__#${VERSION#v}#g" -e "s#__REPO__#${{ github.repository }}#g" .github/release-notes.md >> notes.md
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md docker-compose.yml
