# Pull requests (outside contributions) and by hand: type checks, formatting, all tests (pnpm check) and the production
# build. Not on every push to main (user 2026-10-20: "设置CI只在发布时才运行，这种日常更新可以不CI"): those are checked
# locally before pushing, and a release runs the same checks before it builds (release.yml).
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
